name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run (smoke | navigation | forms | functional | visual | responsive | all)'
        required: false
        default: 'all'

env:
  SITE_URL: https://www.famigo.com
  CI: 'true'

jobs:
  # ── Fast gate: smoke only ─────────────────────────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: TypeScript check
        run: npm run typecheck

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  # ── Full suite: runs only if smoke passes ─────────────────────────────────
  full-suite:
    name: Full Test Suite
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, mobile-chrome, tablet]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all tests (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── Functional tests (separate job for clear reporting) ───────────────────
  functional:
    name: Functional Tests
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run functional tests
        run: npx playwright test --grep @functional --project=chromium-desktop
        continue-on-error: true

      - name: Upload functional report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-report
          path: playwright-report/
          retention-days: 14
